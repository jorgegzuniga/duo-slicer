name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/engine_selftest.sh

  app:
    name: App compiles (simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner: $(ls -d /Applications/Xcode*.app | xargs)"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice::Using $X"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project A1Slicer.xcodeproj -scheme A1Slicer -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(Swift|swift)|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
