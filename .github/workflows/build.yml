name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine self-test (all printers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./tools/engine_selftest.sh

  relay:
    name: Claude relay smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run the relay locally and talk MCP to it
        working-directory: relay
        run: |
          npm ci --no-audit --no-fund
          npx wrangler dev --port 8787 --ip 127.0.0.1 > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          node test/smoke.mjs || { tail -40 dev.log; exit 1; }

  app:
    name: App compiles + simulator screenshots
    # Xcode 27.1 / iOS 27.1 SDK: apps built with older SDKs run in a phone-sized window on the iPhone Duo's inner screen
    runs-on: xcode-27
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: |
          X=/Applications/Xcode_27.1.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_27.[1-9]*.app 2>/dev/null | grep -v -i candidate | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 27.1 on this runner: $(ls -d /Applications/Xcode*.app | xargs)"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice::Using $X"
          xcodebuild -version
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project A1Slicer.xcodeproj -scheme A1Slicer -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO DUO_FLAGS=DUO_SDK build > build.log 2>&1 || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            { grep -nE "error|Error|failed|Undefined|ld: " build.log | head -300 || true; echo "----- tail"; tail -150 build.log; } > build-errors.txt
            { grep -E "error:" build.log || true; } | sort -u | head -40 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            tail -20 build.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
            exit 1
          fi
      - name: Screenshots
        continue-on-error: true
        timeout-minutes: 25
        run: ci/simulator.sh screenshots
      - name: Claude end to end (local relay + the app in the simulator)
        id: e2e
        continue-on-error: true
        timeout-minutes: 20
        run: ci/simulator.sh claude
      - name: iPhone Duo unfolded (inner screen, through Device Hub)
        continue-on-error: true
        timeout-minutes: 20
        run: ci/simulator.sh unfold
      - name: Add printer finds printers on the network (stand-ins on the runner)
        continue-on-error: true
        timeout-minutes: 10
        run: ci/simulator.sh discover
      - name: Several printers, cameras and the print queue (stand-in printers on the runner)
        continue-on-error: true
        timeout-minutes: 20
        run: ci/simulator.sh fleet
      - name: Publish the build errors to the ci-logs branch
        if: failure() && github.event_name == 'push'
        run: |
          [ -f build-errors.txt ] || exit 0
          cp build-errors.txt "$RUNNER_TEMP/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ci-logs-publish
          git rm -rfq .
          git clean -fdxq
          cp "$RUNNER_TEMP/build-errors.txt" .
          git add build-errors.txt
          git commit -qm "Build errors for $GITHUB_SHA"
          git push -fq origin HEAD:ci-logs
      - name: Publish screenshots to the screenshots branch
        if: github.event_name == 'push'
        run: |
          [ -n "$(ls shots/* 2>/dev/null)" ] || exit 0
          cp -R shots "$RUNNER_TEMP/shots"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-publish
          git rm -rfq .
          rm -rf build shots
          git clean -fdxq
          cp "$RUNNER_TEMP"/shots/*.png "$RUNNER_TEMP"/shots/*.txt . 2>/dev/null || true
          printf '# Simulator screenshots\n\nFrom %s (%s).\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git add -A
          git commit -qm "Screenshots for $GITHUB_SHA"
          git push -fq origin HEAD:screenshots

  inner:
    name: iPhone Duo unfolded layouts (inner-screen size, on a 13-inch iPad)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: |
          X=/Applications/Xcode_27.1.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_27.[1-9]*.app 2>/dev/null | grep -v -i candidate | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen
      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project A1Slicer.xcodeproj -scheme A1Slicer -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO DUO_FLAGS=DUO_SDK build > build.log 2>&1 || true
          grep -q "BUILD SUCCEEDED" build.log || { tail -40 build.log; exit 1; }
      - name: Screenshots
        timeout-minutes: 30
        run: ci/simulator.sh inner
      - name: Publish to the screenshots-inner branch
        if: always() && github.event_name == 'push'
        run: |
          [ -n "$(ls shots/*.png 2>/dev/null)" ] || exit 0
          cp -R shots "$RUNNER_TEMP/shots"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan inner-publish
          git rm -rfq .
          rm -rf build shots
          git clean -fdxq
          cp "$RUNNER_TEMP"/shots/*.png "$RUNNER_TEMP"/shots/*.txt . 2>/dev/null || true
          printf '# iPhone Duo unfolded layouts\n\nFrom %s (%s).\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git add -A
          git commit -qm "Inner-screen screenshots for $GITHUB_SHA"
          git push -fq origin HEAD:screenshots-inner
