name: TestFlight

# Builds, signs (cloud-managed signing via an App Store Connect API key) and uploads to TestFlight.
# Needs repository secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's full text).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY" ]; then
            echo "TestFlight secrets aren't set yet; skipping upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Select Xcode 26
        if: steps.secrets.outputs.ready == 'true'
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner: $(ls -d /Applications/Xcode*.app | xargs)"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice::Using $X"
          xcodebuild -version
      - name: Install XcodeGen
        if: steps.secrets.outputs.ready == 'true'
        run: brew install xcodegen
      - name: Generate project
        if: steps.secrets.outputs.ready == 'true'
        run: xcodegen generate
      - name: Claude relay address
        if: steps.secrets.outputs.ready == 'true'
        id: relay
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # bake the relay URL into the app when the relay is deployed from this repository
          url=""
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            sub=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/subdomain" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("subdomain") or "")' || true)
            [ -n "$sub" ] && url="https://duo-slicer-relay.$sub.workers.dev"
          fi
          echo "::notice::Claude relay: ${url:-not set up yet}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        env:
          DUO_RELAY_URL: ${{ steps.relay.outputs.url }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Rebuild the PEM: secrets pasted on a phone often lose their line breaks or pick up stray spaces.
          printf '%s' "$ASC_KEY_P8" | python3 -c '
          import sys, re, base64, textwrap
          raw = sys.stdin.read()
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body + "=" * (-len(body) % 4))
          except Exception:
              sys.exit("ASC_KEY_P8 is not a valid .p8 key")
          if not raw.strip().startswith("-----") and der.startswith(b"-----BEGIN"):
              txt = der.decode()  # the secret was the whole file base64-encoded
              body = re.sub(r"[^A-Za-z0-9+/=]", "", re.sub(r"-----(BEGIN|END)[^-]*-----", "", txt))
              der = base64.b64decode(body)
          print("key bytes:", len(der), file=sys.stderr)
          sys.stdout.write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          ' > "$KEY_PATH"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          xcodebuild -project A1Slicer.xcodeproj -scheme A1Slicer -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/A1Slicer.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DUO_RELAY_URL="$DUO_RELAY_URL" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive > archive.log 2>&1 || {
              grep -E "error:|error |Error|failed|No profiles|signing|Signing|provision" archive.log | grep -v "^\s*$" | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
              tail -15 archive.log | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
              exit 1
            }
          tail -5 archive.log
      - name: List apps visible to the API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import jwt, time, os, json, urllib.request
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "AuthKey_%s.p8" % os.environ["ASC_KEY_ID"])).read()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?fields[apps]=bundleId,name&limit=50",
                                       headers={"Authorization": "Bearer " + tok})
          try:
              data = json.load(urllib.request.urlopen(req))
              apps = data.get("data", [])
              print("::notice::App Store Connect apps visible to this key: " + (", ".join('%s = "%s"' % (a["attributes"]["name"], a["attributes"]["bundleId"]) for a in apps) or "none"))
          except urllib.error.HTTPError as e:
              print("::error::App Store Connect API %s: %s" % (e.code, e.read().decode()[:600]))
          PY
      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/A1Slicer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 || {
              grep -E "error:|error |Error|failed|No profiles|signing|Signing|provision|ITMS" export.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
              tail -15 export.log | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
              exit 1
            }
          tail -10 export.log
