name: Probe runners

on:
  workflow_dispatch:
  push:
    branches: [multi-printer]
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Xcodes and simulators
        run: |
          echo "::notice::${{ matrix.os }} macOS $(sw_vers -productVersion) $(uname -m)"
          echo "::notice::Xcodes: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice::Selected: $(xcodebuild -version | tr '\n' ' ')"
          echo "::notice::SDKs: $(xcodebuild -showsdks 2>/dev/null | grep -o 'iphoneos[0-9.]*\|iphonesimulator[0-9.]*' | sort -u | tr '\n' ' ')"
          echo "::notice::Runtimes: $(xcrun simctl list runtimes 2>/dev/null | grep -i ios | tr '\n' ';')"
          echo "::notice::Duo devices: $(xcrun simctl list devicetypes 2>/dev/null | grep -i -E 'duo|fold' | tr '\n' ';')"
          echo "::notice::iPhones: $(xcrun simctl list devices available 2>/dev/null | grep -E 'iPhone|iPad' | sed 's/(.*//' | sort -u | tr '\n' ';')"
